<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamcatcher - Note Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 1rem;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.95rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        textarea::placeholder {
            color: #666;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4f46e5;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #065f46;
            border: 1px solid #10b981;
            color: #d1fae5;
        }

        .status.error {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fecaca;
        }

        .status.show {
            display: block;
        }

        .info-box {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .info-box h3 {
            color: #6366f1;
            margin-bottom: 0.5rem;
        }

        .info-box p {
            color: #999;
            font-size: 0.95rem;
        }

        .info-box code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 4px;
            color: #10b981;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dreamcatcher</h1>
        <p class="subtitle">Archive your notes to Notion</p>

        <div class="info-box">
            <h3>How it works</h3>
            <p>Paste your notes below. Each note should have a timestamp in the format <code>2025.12.26.1430.GMT-0800</code> or similar. The system will parse your notes and archive them by day into your Notion database.</p>
        </div>

        <form id="archiveForm">
            <div class="form-group">
                <label for="notes">Your Notes</label>
                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Paste your notes here...

2025.12.26.1430.GMT-0800
This is an example note
With multiple lines

2025.12.26.1545.GMT-0800
Another note entry"
                    required
                ></textarea>
            </div>

            <button type="submit" id="submitBtn">Archive to Notion</button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script>
        const form = document.getElementById('archiveForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const notes = document.getElementById('notes').value;

            if (!notes.trim()) {
                showStatus('Please enter some notes', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Archiving...';
            statusDiv.classList.remove('show');

            try {
                const response = await fetch('/api/archive', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ notes }),
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(data.message || 'Notes archived successfully!', 'success');
                    // Clear the textarea after successful submission
                    document.getElementById('notes').value = '';
                } else {
                    showStatus(data.error || 'Failed to archive notes', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Archive to Notion';
            }
        });

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type} show`;
        }
    </script>
</body>
</html>
