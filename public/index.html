<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamcatcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'iA Writer Mono', 'iA Writer Quattro', 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1a1a1a;
            color: #b0b0b0;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .title {
            font-size: 0.875rem;
            color: #666;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .notion-link {
            color: #666;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notion-link:hover {
            color: #999;
        }

        .archive-btn {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 6px 16px;
            font-size: 0.875rem;
            font-weight: 400;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .archive-btn:hover {
            background: #222;
            color: #999;
            border-color: #444;
        }

        .archive-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Main editor area */
        .editor-container {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .editor-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 48px 24px;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            min-height: calc(100vh - 200px);
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 1.125rem;
            line-height: 1.7;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #444;
        }

        /* Status bar */
        .status-bar {
            padding: 12px 24px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.8125rem;
            color: #666;
            text-align: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .status-bar.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-top-color: rgba(16, 185, 129, 0.2);
        }

        .status-bar.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-top-color: rgba(239, 68, 68, 0.2);
        }

        .status-bar.hidden {
            opacity: 0;
            height: 0;
            padding: 0;
            border: none;
        }

        /* Keyboard shortcut hint */
        .shortcut {
            opacity: 0.5;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: transparent;
            color: #666;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 400;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-btn:hover {
            background: #222;
            color: #999;
        }

        .tab-btn.active {
            background: #2a2a2a;
            color: #e0e0e0;
        }

        /* Tab content */
        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Reflect tab styles */
        #reflectTab {
            justify-content: center;
            align-items: center;
            padding: 5vh 5vw;
            text-align: center;
            transition: background-color 1s ease, color 0.5s ease;
            overflow: hidden;
        }

        .reflect-content {
            max-width: 90vw;
            max-height: 85vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.8s ease;
        }

        .reflect-loading {
            color: #666;
            font-size: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .theme-summary {
            font-size: clamp(1.5rem, 4vw, 3.5rem);
            line-height: 1.3;
            color: #e0e0e0;
            margin-bottom: 3vh;
            font-weight: 300;
            transition: all 0.8s ease;
        }

        .insight {
            font-size: clamp(1rem, 2.5vw, 2rem);
            line-height: 1.4;
            color: #999;
            margin-bottom: 3vh;
            font-weight: 300;
            transition: all 0.8s ease;
        }

        .objective-section {
            margin-top: 4vh;
            transition: all 0.8s ease;
        }

        .objective-label {
            font-size: clamp(0.75rem, 1.2vw, 1rem);
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1vh;
            transition: all 0.8s ease;
        }

        .objective {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            line-height: 1.3;
            color: #b0b0b0;
            font-weight: 400;
            transition: all 0.8s ease;
        }

        /* Animations - color and opacity only */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        @keyframes float {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 1; }
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .animate-pulse {
            animation: pulse 3s ease-in-out infinite;
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-breathe {
            animation: breathe 5s ease-in-out infinite;
        }

        .animate-shimmer {
            animation: shimmer 2s ease-in-out infinite;
        }

        /* Thoughts tab styles */
        #thoughtsTab {
            overflow-y: auto;
        }

        .thoughts-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .thoughts-loading {
            color: #666;
            font-size: 1.2rem;
            text-align: center;
            padding: 48px;
        }

        .thought-entry {
            margin-bottom: 48px;
            padding-bottom: 48px;
            border-bottom: 1px solid #2a2a2a;
        }

        .thought-entry:last-child {
            border-bottom: none;
        }

        .thought-date {
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .thought-content {
            font-size: 1.125rem;
            line-height: 1.7;
            color: #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .refresh-btn {
            margin-top: 48px;
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 400;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .refresh-btn:hover {
            background: #222;
            color: #999;
            border-color: #444;
        }

        /* Smooth scrollbar */
        .editor-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .editor-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .editor-wrapper::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .editor-wrapper::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">DREAMCATCHER</div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="write">write</button>
            <button class="tab-btn" data-tab="reflect">reflect</button>
            <button class="tab-btn" data-tab="thoughts">thoughts</button>
        </div>
        <div class="actions">
            <a href="https://www.notion.so/psql/2d5acec90a90802ab8b3dfa8a3258357" target="_blank" class="notion-link">
                <span>→ Database</span>
            </a>
            <button type="button" id="archiveBtn" class="archive-btn">
                Archive
                <span class="shortcut">⌘↵</span>
            </button>
        </div>
    </div>

    <!-- Write Tab -->
    <div id="writeTab" class="tab-content active">
        <div class="editor-container">
            <div class="editor-wrapper">
                <form id="archiveForm">
                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="2025.12.26.1430.GMT-0800
Your notes here...

2025.12.26.1545.GMT-0800
Another entry..."
                        autofocus
                    ></textarea>
                </form>
            </div>
        </div>
    </div>

    <!-- Reflect Tab -->
    <div id="reflectTab" class="tab-content">
        <div class="reflect-content">
            <div class="reflect-loading">loading your reflections...</div>
        </div>
    </div>

    <!-- Thoughts Tab -->
    <div id="thoughtsTab" class="tab-content">
        <div class="thoughts-container">
            <div class="thoughts-loading">loading your thoughts...</div>
        </div>
    </div>

    <div id="statusBar" class="status-bar hidden"></div>

    <script>
        const form = document.getElementById('archiveForm');
        const textarea = document.getElementById('notes');
        const archiveBtn = document.getElementById('archiveBtn');
        const statusBar = document.getElementById('statusBar');

        // Tab switching
        const tabBtns = document.querySelectorAll('.tab-btn');
        const writeTab = document.getElementById('writeTab');
        const reflectTab = document.getElementById('reflectTab');
        const thoughtsTab = document.getElementById('thoughtsTab');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;

                // Update active button
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Hide all tabs
                writeTab.classList.remove('active');
                reflectTab.classList.remove('active');
                thoughtsTab.classList.remove('active');

                // Show selected tab
                if (tabName === 'write') {
                    writeTab.classList.add('active');
                    archiveBtn.style.display = '';
                } else if (tabName === 'reflect') {
                    reflectTab.classList.add('active');
                    archiveBtn.style.display = 'none';
                    loadReflection();
                } else if (tabName === 'thoughts') {
                    thoughtsTab.classList.add('active');
                    archiveBtn.style.display = 'none';
                    loadThoughts();
                }
            });
        });

        // Handle form submission
        async function archiveNotes(e) {
            if (e) e.preventDefault();

            const notes = textarea.value;

            if (!notes.trim()) {
                showStatus('Nothing to archive', 'error');
                return;
            }

            archiveBtn.disabled = true;
            archiveBtn.textContent = 'Archiving...';
            statusBar.className = 'status-bar hidden';

            try {
                const response = await fetch('/api/archive', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ notes }),
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(data.message || 'Archived successfully', 'success');
                    textarea.value = '';
                    textarea.focus();
                } else {
                    showStatus(data.error || 'Failed to archive', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('Network error. Please try again.', 'error');
            } finally {
                archiveBtn.disabled = false;
                archiveBtn.innerHTML = 'Archive<span class="shortcut">⌘↵</span>';
            }
        }

        function showStatus(message, type) {
            statusBar.textContent = message;
            statusBar.className = `status-bar ${type}`;

            if (type === 'success') {
                setTimeout(() => {
                    statusBar.className = 'status-bar hidden';
                }, 3000);
            }
        }

        // Submit on button click
        archiveBtn.addEventListener('click', archiveNotes);
        form.addEventListener('submit', archiveNotes);

        // Keyboard shortcut: Cmd+Enter (Mac) or Ctrl+Enter (Windows/Linux)
        textarea.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                archiveNotes();
            }
        });

        // Load reflection
        async function loadReflection() {
            const reflectContent = document.querySelector('.reflect-content');
            const reflectTab = document.getElementById('reflectTab');
            reflectContent.innerHTML = '<div class="reflect-loading">loading your reflections...</div>';

            try {
                const response = await fetch('/api/reflect');
                const data = await response.json();

                if (response.ok) {
                    const styles = data.styles || {};

                    // Apply dynamic background color to the tab
                    reflectTab.style.backgroundColor = styles.backgroundColor || '#1a1a1a';

                    // Get animation class
                    const animationClass = styles.animation !== 'none'
                        ? `animate-${styles.animation}`
                        : '';

                    reflectContent.innerHTML = `
                        <div class="theme-summary ${animationClass}" style="
                            color: ${styles.textColor || '#e0e0e0'};
                            font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                            font-weight: ${styles.fontWeight || '300'};
                            letter-spacing: ${styles.letterSpacing || '0.02em'};
                            text-transform: ${styles.textTransform || 'none'};
                        ">${data.theme}</div>
                        <div class="insight" style="
                            color: ${styles.textColor || '#999'};
                            font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                            font-weight: ${styles.fontWeight || '300'};
                            letter-spacing: ${styles.letterSpacing || '0.02em'};
                        ">${data.insight}</div>
                        <div class="objective-section">
                            <div class="objective-label" style="
                                color: ${styles.accentColor || '#666'};
                                font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                                text-transform: ${styles.textTransform || 'uppercase'};
                            ">Suggested Objective</div>
                            <div class="objective" style="
                                color: ${styles.textColor || '#b0b0b0'};
                                font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                                font-weight: ${styles.fontWeight || '400'};
                                letter-spacing: ${styles.letterSpacing || '0.02em'};
                            ">${data.objective}</div>
                        </div>
                        <button class="refresh-btn" onclick="loadReflection()" style="
                            color: ${styles.accentColor || '#666'};
                            border-color: ${styles.accentColor || '#333'};
                            font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                        ">refresh ↻</button>
                    `;
                } else {
                    reflectContent.innerHTML = `
                        <div class="reflect-loading" style="color: #ef4444;">
                            ${data.error || 'Failed to load reflection'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading reflection:', error);
                reflectContent.innerHTML = `
                    <div class="reflect-loading" style="color: #ef4444;">
                        Network error. Please try again.
                    </div>
                `;
            }
        }

        // Thoughts pagination state
        let thoughtsPage = 0;
        let thoughtsHasMore = true;
        let thoughtsLoading = false;

        // Load thoughts with pagination
        async function loadThoughts(append = false) {
            const thoughtsContainer = document.querySelector('.thoughts-container');

            if (thoughtsLoading) return;
            thoughtsLoading = true;

            if (!append) {
                thoughtsPage = 0;
                thoughtsHasMore = true;
                thoughtsContainer.innerHTML = '<div class="thoughts-loading">loading your thoughts...</div>';
            }

            try {
                const response = await fetch(`/api/thoughts?page=${thoughtsPage}&limit=20`);
                const data = await response.json();

                if (response.ok && data.notes) {
                    if (data.notes.length === 0 && thoughtsPage === 0) {
                        thoughtsContainer.innerHTML = `
                            <div class="thoughts-loading">
                                No thoughts yet. Start writing to see them here!
                            </div>
                        `;
                        thoughtsHasMore = false;
                    } else {
                        const notesHTML = data.notes.map(note => `
                            <div class="thought-entry">
                                <div class="thought-date">${note.date} • ${note.timestamp}</div>
                                <div class="thought-content">${note.content}</div>
                            </div>
                        `).join('');

                        if (append) {
                            // Remove loading indicator if present
                            const loadingEl = thoughtsContainer.querySelector('.thoughts-loading');
                            if (loadingEl) loadingEl.remove();
                            thoughtsContainer.insertAdjacentHTML('beforeend', notesHTML);
                        } else {
                            thoughtsContainer.innerHTML = notesHTML;
                        }

                        thoughtsHasMore = data.hasMore;
                        thoughtsPage++;

                        // Add loading indicator if there are more
                        if (thoughtsHasMore && !thoughtsContainer.querySelector('.thoughts-loading')) {
                            thoughtsContainer.insertAdjacentHTML('beforeend', '<div class="thoughts-loading">...</div>');
                        }
                    }
                } else {
                    if (!append) {
                        thoughtsContainer.innerHTML = `
                            <div class="thoughts-loading" style="color: #ef4444;">
                                ${data.error || 'Failed to load thoughts'}
                            </div>
                        `;
                    }
                }
            } catch (error) {
                console.error('Error loading thoughts:', error);
                if (!append) {
                    thoughtsContainer.innerHTML = `
                        <div class="thoughts-loading" style="color: #ef4444;">
                            Network error. Please try again.
                        </div>
                    `;
                }
            } finally {
                thoughtsLoading = false;
            }
        }

        // Infinite scroll for thoughts
        thoughtsTab.addEventListener('scroll', () => {
            const scrollPosition = thoughtsTab.scrollTop + thoughtsTab.clientHeight;
            const scrollHeight = thoughtsTab.scrollHeight;

            // Load more when scrolled to 80% of the way down
            if (scrollPosition >= scrollHeight * 0.8 && thoughtsHasMore && !thoughtsLoading) {
                loadThoughts(true);
            }
        });

        // Auto-resize textarea
        textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        });
    </script>
</body>
</html>
