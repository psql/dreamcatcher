<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamcatcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'iA Writer Mono', 'iA Writer Quattro', 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1a1a1a;
            color: #b0b0b0;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .title {
            font-size: 0.875rem;
            color: #666;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .notion-link {
            color: #666;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notion-link:hover {
            color: #999;
        }

        .archive-btn {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 6px 16px;
            font-size: 0.875rem;
            font-weight: 400;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .archive-btn:hover {
            background: #222;
            color: #999;
            border-color: #444;
        }

        .archive-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Main editor area */
        .editor-container {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .editor-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 48px 24px;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            min-height: calc(100vh - 200px);
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 1.125rem;
            line-height: 1.7;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #444;
        }

        /* Status bar */
        .status-bar {
            padding: 12px 24px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.8125rem;
            color: #666;
            text-align: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .status-bar.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-top-color: rgba(16, 185, 129, 0.2);
        }

        .status-bar.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-top-color: rgba(239, 68, 68, 0.2);
        }

        .status-bar.hidden {
            opacity: 0;
            height: 0;
            padding: 0;
            border: none;
        }

        /* Keyboard shortcut hint */
        .shortcut {
            opacity: 0.5;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: transparent;
            color: #666;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 400;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-btn:hover {
            background: #222;
            color: #999;
        }

        .tab-btn.active {
            background: #2a2a2a;
            color: #e0e0e0;
        }

        .tab-btn.focused {
            outline: 2px solid #4a9eff;
            outline-offset: 2px;
        }

        /* Tab content */
        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Reflect tab styles */
        #reflectTab {
            justify-content: center;
            align-items: center;
            padding: 5vh 5vw;
            text-align: center;
            transition: background-color 1s ease, color 0.5s ease;
            overflow: hidden;
        }

        .reflect-content {
            max-width: 90vw;
            max-height: 85vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.8s ease;
        }

        .reflect-loading {
            color: #666;
            font-size: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .theme-summary {
            font-size: clamp(1.5rem, 4vw, 3.5rem);
            line-height: 1.3;
            color: #e0e0e0;
            margin-bottom: 3vh;
            font-weight: 300;
            transition: all 0.8s ease;
        }

        .insight {
            font-size: clamp(1rem, 2.5vw, 2rem);
            line-height: 1.4;
            color: #999;
            margin-bottom: 3vh;
            font-weight: 300;
            transition: all 0.8s ease;
        }

        .objective-section {
            margin-top: 4vh;
            transition: all 0.8s ease;
        }

        .objective-label {
            font-size: clamp(0.75rem, 1.2vw, 1rem);
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1vh;
            transition: all 0.8s ease;
        }

        .objective {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            line-height: 1.3;
            color: #b0b0b0;
            font-weight: 400;
            transition: all 0.8s ease;
        }

        /* Animations - color and opacity only */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        @keyframes float {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 1; }
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .animate-pulse {
            animation: pulse 3s ease-in-out infinite;
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-breathe {
            animation: breathe 5s ease-in-out infinite;
        }

        .animate-shimmer {
            animation: shimmer 2s ease-in-out infinite;
        }

        /* Thoughts tab styles */
        #thoughtsTab {
            overflow-y: auto;
        }

        .thoughts-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .thoughts-loading {
            color: #666;
            font-size: 1.2rem;
            text-align: center;
            padding: 48px;
        }

        .thought-entry {
            margin-bottom: 48px;
            padding-bottom: 48px;
            border-bottom: 1px solid #2a2a2a;
        }

        .thought-entry:last-child {
            border-bottom: none;
        }

        .thought-date {
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .thought-content {
            font-size: 1.125rem;
            line-height: 1.7;
            color: #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .refresh-btn {
            margin-top: 48px;
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 400;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .refresh-btn:hover {
            background: #222;
            color: #999;
            border-color: #444;
        }

        /* Command Palette */
        .command-palette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding-top: 20vh;
            z-index: 9999;
        }

        .command-palette-overlay.active {
            display: flex;
        }

        .command-palette {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .command-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #2a2a2a;
            padding: 20px 24px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 1.125rem;
            outline: none;
        }

        .command-input::placeholder {
            color: #666;
        }

        .command-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .command-item {
            padding: 14px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.15s;
            border-bottom: 1px solid #222;
        }

        .command-item:last-child {
            border-bottom: none;
        }

        .command-item:hover,
        .command-item.selected {
            background: #2a2a2a;
        }

        .command-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .command-text {
            flex: 1;
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        .command-shortcut {
            color: #666;
            font-size: 0.8rem;
            font-family: 'Courier Prime', monospace;
        }

        /* Smooth scrollbar */
        .editor-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .editor-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .editor-wrapper::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .editor-wrapper::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">DREAMCATCHER</div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="write">write</button>
            <button class="tab-btn" data-tab="reflect">reflect</button>
            <button class="tab-btn" data-tab="thoughts">thoughts</button>
        </div>
        <div class="actions">
            <a href="https://www.notion.so/psql/2d5acec90a90802ab8b3dfa8a3258357" target="_blank" class="notion-link">
                <span>→ Database</span>
            </a>
            <button type="button" id="archiveBtn" class="archive-btn">
                Archive
                <span class="shortcut">⌘↵</span>
            </button>
        </div>
    </div>

    <!-- Write Tab -->
    <div id="writeTab" class="tab-content active">
        <div class="editor-container">
            <div class="editor-wrapper">
                <form id="archiveForm">
                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="2025.12.26.1430.GMT-0800
Your notes here...

2025.12.26.1545.GMT-0800
Another entry..."
                        autofocus
                    ></textarea>
                </form>
            </div>
        </div>
    </div>

    <!-- Reflect Tab -->
    <div id="reflectTab" class="tab-content">
        <div class="reflect-content">
            <div class="reflect-loading">loading your reflections...</div>
        </div>
    </div>

    <!-- Thoughts Tab -->
    <div id="thoughtsTab" class="tab-content">
        <div class="thoughts-container">
            <div class="thoughts-loading">loading your thoughts...</div>
        </div>
    </div>

    <div id="statusBar" class="status-bar hidden"></div>

    <!-- Command Palette -->
    <div id="commandPalette" class="command-palette-overlay">
        <div class="command-palette">
            <input
                type="text"
                id="commandInput"
                class="command-input"
                placeholder="Type a command..."
                autocomplete="off"
            />
            <div id="commandList" class="command-list"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('archiveForm');
        const textarea = document.getElementById('notes');
        const archiveBtn = document.getElementById('archiveBtn');
        const statusBar = document.getElementById('statusBar');

        // Tab switching
        const tabBtns = document.querySelectorAll('.tab-btn');
        const writeTab = document.getElementById('writeTab');
        const reflectTab = document.getElementById('reflectTab');
        const thoughtsTab = document.getElementById('thoughtsTab');

        let focusedTabIndex = 0;
        let tabNavigationMode = false;

        function activateTab(tabName) {
            // Update active button
            tabBtns.forEach(b => b.classList.remove('active'));
            const targetBtn = document.querySelector(`[data-tab="${tabName}"]`);
            if (targetBtn) {
                targetBtn.classList.add('active');
            }

            // Hide all tabs
            writeTab.classList.remove('active');
            reflectTab.classList.remove('active');
            thoughtsTab.classList.remove('active');

            // Show selected tab
            if (tabName === 'write') {
                writeTab.classList.add('active');
                archiveBtn.style.display = '';
            } else if (tabName === 'reflect') {
                reflectTab.classList.add('active');
                archiveBtn.style.display = 'none';
                loadReflection();
            } else if (tabName === 'thoughts') {
                thoughtsTab.classList.add('active');
                archiveBtn.style.display = 'none';
                loadThoughts();
            }
        }

        function updateTabFocus() {
            tabBtns.forEach((btn, index) => {
                btn.classList.toggle('focused', index === focusedTabIndex);
            });
        }

        function enterTabNavigationMode() {
            tabNavigationMode = true;
            // Find current active tab and focus it
            tabBtns.forEach((btn, index) => {
                if (btn.classList.contains('active')) {
                    focusedTabIndex = index;
                }
            });
            updateTabFocus();
            textarea.blur();
            console.log('📍 Tab navigation mode active');
        }

        function exitTabNavigationMode() {
            tabNavigationMode = false;
            tabBtns.forEach(btn => btn.classList.remove('focused'));
            console.log('✏️ Back to editing mode');
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;
                activateTab(tabName);
                exitTabNavigationMode();
            });
        });

        // Generate current timestamp in the correct format
        function getCurrentTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            // Get timezone offset in format GMT-0800
            const offsetMinutes = now.getTimezoneOffset();
            const offsetHours = Math.abs(Math.floor(offsetMinutes / 60));
            const offsetMins = Math.abs(offsetMinutes % 60);
            const offsetSign = offsetMinutes <= 0 ? '+' : '-';
            const timezone = `GMT${offsetSign}${String(offsetHours).padStart(2, '0')}${String(offsetMins).padStart(2, '0')}`;

            return `${year}.${month}.${day}.${hours}${minutes}.${timezone}`;
        }

        // Check if text contains a timestamp
        function hasTimestamp(text) {
            // Look for pattern like 2025.12.26.1430.GMT-0800
            const timestampPattern = /\d{4}\.\d{2}\.\d{2}\.\d{4}\.GMT[+-]\d{4}/;
            return timestampPattern.test(text);
        }

        // Handle form submission
        async function archiveNotes(e) {
            if (e) e.preventDefault();

            let notes = textarea.value;

            if (!notes.trim()) {
                showStatus('Nothing to archive', 'error');
                return;
            }

            // Auto-add timestamp if none exists
            if (!hasTimestamp(notes)) {
                const timestamp = getCurrentTimestamp();
                notes = `${timestamp}\n${notes}`;
                console.log('📅 Auto-added timestamp:', timestamp);
            }

            archiveBtn.disabled = true;
            archiveBtn.textContent = 'Archiving...';
            statusBar.className = 'status-bar hidden';

            try {
                const response = await fetch('/api/archive', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ notes }),
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(data.message || 'Archived successfully', 'success');
                    textarea.value = '';
                    textarea.focus();
                } else {
                    showStatus(data.error || 'Failed to archive', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('Network error. Please try again.', 'error');
            } finally {
                archiveBtn.disabled = false;
                archiveBtn.innerHTML = 'Archive<span class="shortcut">⌘↵</span>';
            }
        }

        function showStatus(message, type) {
            statusBar.textContent = message;
            statusBar.className = `status-bar ${type}`;

            if (type === 'success') {
                setTimeout(() => {
                    statusBar.className = 'status-bar hidden';
                }, 3000);
            }
        }

        // Submit on button click
        archiveBtn.addEventListener('click', archiveNotes);
        form.addEventListener('submit', archiveNotes);

        // Keyboard shortcut: Cmd+Enter (Mac) or Ctrl+Enter (Windows/Linux)
        textarea.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                archiveNotes();
            }
        });

        // Load reflection
        async function loadReflection() {
            const reflectContent = document.querySelector('.reflect-content');
            const reflectTab = document.getElementById('reflectTab');
            reflectContent.innerHTML = '<div class="reflect-loading">loading your reflections...</div>';

            try {
                const response = await fetch('/api/reflect');
                const data = await response.json();

                if (response.ok) {
                    const styles = data.styles || {};

                    // Apply dynamic background color to the tab
                    reflectTab.style.backgroundColor = styles.backgroundColor || '#1a1a1a';

                    // Get animation class
                    const animationClass = styles.animation !== 'none'
                        ? `animate-${styles.animation}`
                        : '';

                    reflectContent.innerHTML = `
                        <div class="theme-summary ${animationClass}" style="
                            color: ${styles.textColor || '#e0e0e0'};
                            font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                            font-weight: ${styles.fontWeight || '300'};
                            letter-spacing: ${styles.letterSpacing || '0.02em'};
                            text-transform: ${styles.textTransform || 'none'};
                        ">${data.theme}</div>
                        <div class="insight" style="
                            color: ${styles.textColor || '#999'};
                            font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                            font-weight: ${styles.fontWeight || '300'};
                            letter-spacing: ${styles.letterSpacing || '0.02em'};
                        ">${data.insight}</div>
                        <div class="objective-section">
                            <div class="objective-label" style="
                                color: ${styles.accentColor || '#666'};
                                font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                                text-transform: ${styles.textTransform || 'uppercase'};
                            ">Suggested Objective</div>
                            <div class="objective" style="
                                color: ${styles.textColor || '#b0b0b0'};
                                font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                                font-weight: ${styles.fontWeight || '400'};
                                letter-spacing: ${styles.letterSpacing || '0.02em'};
                            ">${data.objective}</div>
                        </div>
                        <button class="refresh-btn" onclick="loadReflection()" style="
                            color: ${styles.accentColor || '#666'};
                            border-color: ${styles.accentColor || '#333'};
                            font-family: '${styles.fontFamily || 'Inter'}', sans-serif;
                        ">refresh ↻</button>
                    `;
                } else {
                    reflectContent.innerHTML = `
                        <div class="reflect-loading" style="color: #ef4444;">
                            ${data.error || 'Failed to load reflection'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading reflection:', error);
                reflectContent.innerHTML = `
                    <div class="reflect-loading" style="color: #ef4444;">
                        Network error. Please try again.
                    </div>
                `;
            }
        }

        // Thoughts pagination state
        let thoughtsPage = 0;
        let thoughtsHasMore = true;
        let thoughtsLoading = false;

        // Load thoughts with pagination
        async function loadThoughts(append = false) {
            const thoughtsContainer = document.querySelector('.thoughts-container');

            if (thoughtsLoading) return;
            thoughtsLoading = true;

            if (!append) {
                thoughtsPage = 0;
                thoughtsHasMore = true;
                thoughtsContainer.innerHTML = '<div class="thoughts-loading">loading your thoughts...</div>';
            }

            try {
                const response = await fetch(`/api/thoughts?page=${thoughtsPage}&limit=20`);
                const data = await response.json();

                if (response.ok && data.notes) {
                    if (data.notes.length === 0 && thoughtsPage === 0) {
                        thoughtsContainer.innerHTML = `
                            <div class="thoughts-loading">
                                No thoughts yet. Start writing to see them here!
                            </div>
                        `;
                        thoughtsHasMore = false;
                    } else {
                        const notesHTML = data.notes.map(note => `
                            <div class="thought-entry">
                                <div class="thought-date">${note.date} • ${note.timestamp}</div>
                                <div class="thought-content">${note.content}</div>
                            </div>
                        `).join('');

                        if (append) {
                            // Remove loading indicator if present
                            const loadingEl = thoughtsContainer.querySelector('.thoughts-loading');
                            if (loadingEl) loadingEl.remove();
                            thoughtsContainer.insertAdjacentHTML('beforeend', notesHTML);
                        } else {
                            thoughtsContainer.innerHTML = notesHTML;
                        }

                        thoughtsHasMore = data.hasMore;
                        thoughtsPage++;

                        // Add loading indicator if there are more
                        if (thoughtsHasMore && !thoughtsContainer.querySelector('.thoughts-loading')) {
                            thoughtsContainer.insertAdjacentHTML('beforeend', '<div class="thoughts-loading">...</div>');
                        }
                    }
                } else {
                    if (!append) {
                        thoughtsContainer.innerHTML = `
                            <div class="thoughts-loading" style="color: #ef4444;">
                                ${data.error || 'Failed to load thoughts'}
                            </div>
                        `;
                    }
                }
            } catch (error) {
                console.error('Error loading thoughts:', error);
                if (!append) {
                    thoughtsContainer.innerHTML = `
                        <div class="thoughts-loading" style="color: #ef4444;">
                            Network error. Please try again.
                        </div>
                    `;
                }
            } finally {
                thoughtsLoading = false;
            }
        }

        // Infinite scroll for thoughts
        thoughtsTab.addEventListener('scroll', () => {
            const scrollPosition = thoughtsTab.scrollTop + thoughtsTab.clientHeight;
            const scrollHeight = thoughtsTab.scrollHeight;

            // Load more when scrolled to 80% of the way down
            if (scrollPosition >= scrollHeight * 0.8 && thoughtsHasMore && !thoughtsLoading) {
                loadThoughts(true);
            }
        });

        // Backup functionality
        async function saveBackup() {
            const content = textarea.value;
            if (!content || content.trim() === '') return;

            try {
                await fetch('/api/backup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content }),
                });
                console.log('💾 Backup saved');
            } catch (error) {
                console.error('Failed to save backup:', error);
            }
        }

        async function loadBackup() {
            try {
                const response = await fetch('/api/backup');
                const data = await response.json();
                if (data.success && data.content && data.content.trim() !== '') {
                    textarea.value = data.content;
                    textarea.style.height = 'auto';
                    textarea.style.height = textarea.scrollHeight + 'px';
                    console.log('📂 Backup restored');
                }
            } catch (error) {
                console.error('Failed to load backup:', error);
            }
        }

        // Load backup on page load
        loadBackup();

        // Auto-save every 5 minutes
        setInterval(saveBackup, 5 * 60 * 1000);

        // Save backup when user types (debounced - only after they stop typing for 10 seconds)
        let backupTimeout;
        textarea.addEventListener('input', () => {
            clearTimeout(backupTimeout);
            backupTimeout = setTimeout(saveBackup, 10000);
        });

        // Auto-resize textarea
        textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        });

        // Command Palette
        const commandPalette = document.getElementById('commandPalette');
        const commandInput = document.getElementById('commandInput');
        const commandList = document.getElementById('commandList');
        let selectedCommandIndex = 0;

        const commands = [
            { icon: '✏️', text: 'Go to Write', shortcut: 'W', action: () => switchToTab('write') },
            { icon: '🧘', text: 'Go to Reflect', shortcut: 'R', action: () => switchToTab('reflect') },
            { icon: '📖', text: 'Go to Thoughts', shortcut: 'T', action: () => switchToTab('thoughts') },
            { icon: '📂', text: 'Open Backups Folder', shortcut: 'B', action: openBackupsFolder },
        ];

        let filteredCommands = [...commands];

        function switchToTab(tabName) {
            const btn = document.querySelector(`[data-tab="${tabName}"]`);
            if (btn) btn.click();
            closeCommandPalette();
        }

        async function openBackupsFolder() {
            try {
                const response = await fetch('/api/open-backups');
                const data = await response.json();
                if (data.success) {
                    showStatus('Opened backups folder', 'success');
                } else {
                    showStatus(data.error || 'Failed to open folder', 'error');
                }
            } catch (error) {
                showStatus('Failed to open folder', 'error');
            }
            closeCommandPalette();
        }

        function showCommandPalette() {
            commandPalette.classList.add('active');
            commandInput.value = '';
            filteredCommands = [...commands];
            selectedCommandIndex = 0;
            renderCommands();
            commandInput.focus();
        }

        function closeCommandPalette() {
            commandPalette.classList.remove('active');
            commandInput.value = '';
        }

        function renderCommands() {
            commandList.innerHTML = filteredCommands.map((cmd, index) => `
                <div class="command-item ${index === selectedCommandIndex ? 'selected' : ''}" data-index="${index}">
                    <span class="command-icon">${cmd.icon}</span>
                    <span class="command-text">${cmd.text}</span>
                    <span class="command-shortcut">${cmd.shortcut}</span>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.command-item').forEach((item, index) => {
                item.addEventListener('click', () => {
                    filteredCommands[index].action();
                });
            });
        }

        function filterCommands() {
            const query = commandInput.value.toLowerCase();
            filteredCommands = commands.filter(cmd =>
                cmd.text.toLowerCase().includes(query)
            );
            selectedCommandIndex = 0;
            renderCommands();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Cmd+K or Ctrl+K to open palette
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                if (commandPalette.classList.contains('active')) {
                    closeCommandPalette();
                } else {
                    showCommandPalette();
                }
            }

            // Escape handling
            if (e.key === 'Escape') {
                if (commandPalette.classList.contains('active')) {
                    closeCommandPalette();
                } else if (!tabNavigationMode) {
                    // Enter tab navigation mode
                    e.preventDefault();
                    enterTabNavigationMode();
                }
            }

            // Tab navigation mode
            if (tabNavigationMode && !commandPalette.classList.contains('active')) {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    focusedTabIndex = Math.max(0, focusedTabIndex - 1);
                    updateTabFocus();
                    // Instantly switch to the tab
                    const tabName = tabBtns[focusedTabIndex].dataset.tab;
                    activateTab(tabName);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    focusedTabIndex = Math.min(tabBtns.length - 1, focusedTabIndex + 1);
                    updateTabFocus();
                    // Instantly switch to the tab
                    const tabName = tabBtns[focusedTabIndex].dataset.tab;
                    activateTab(tabName);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    // Exit tab navigation mode and return to editing
                    exitTabNavigationMode();
                    if (document.querySelector('[data-tab="write"]').classList.contains('active')) {
                        textarea.focus();
                    }
                }
            }

            // Navigation and shortcuts when palette is open
            if (commandPalette.classList.contains('active')) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedCommandIndex = Math.min(selectedCommandIndex + 1, filteredCommands.length - 1);
                    renderCommands();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedCommandIndex = Math.max(selectedCommandIndex - 1, 0);
                    renderCommands();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (filteredCommands[selectedCommandIndex]) {
                        filteredCommands[selectedCommandIndex].action();
                    }
                } else {
                    // Single-key shortcuts (only when input is empty)
                    const inputValue = commandInput.value.trim();
                    if (inputValue === '' && e.key.length === 1) {
                        const key = e.key.toUpperCase();
                        const command = filteredCommands.find(cmd => cmd.shortcut === key);
                        if (command) {
                            e.preventDefault();
                            command.action();
                        }
                    }
                }
            }
        });

        // Filter as user types
        commandInput.addEventListener('input', filterCommands);

        // Close on overlay click
        commandPalette.addEventListener('click', (e) => {
            if (e.target === commandPalette) {
                closeCommandPalette();
            }
        });
    </script>
</body>
</html>
