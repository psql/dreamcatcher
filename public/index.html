<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamcatcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'iA Writer Mono', 'iA Writer Quattro', 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1a1a1a;
            color: #b0b0b0;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .title {
            font-size: 0.875rem;
            color: #666;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .notion-link {
            color: #666;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notion-link:hover {
            color: #999;
        }

        .archive-btn {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 6px 16px;
            font-size: 0.875rem;
            font-weight: 400;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .archive-btn:hover {
            background: #222;
            color: #999;
            border-color: #444;
        }

        .archive-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Main editor area */
        .editor-container {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .editor-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 48px 24px;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            min-height: calc(100vh - 200px);
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 1.125rem;
            line-height: 1.7;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #444;
        }

        /* Status bar */
        .status-bar {
            padding: 12px 24px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.8125rem;
            color: #666;
            text-align: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .status-bar.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-top-color: rgba(16, 185, 129, 0.2);
        }

        .status-bar.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-top-color: rgba(239, 68, 68, 0.2);
        }

        .status-bar.hidden {
            opacity: 0;
            height: 0;
            padding: 0;
            border: none;
        }

        /* Keyboard shortcut hint */
        .shortcut {
            opacity: 0.5;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        /* Smooth scrollbar */
        .editor-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .editor-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .editor-wrapper::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .editor-wrapper::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">DREAMCATCHER</div>
        <div class="actions">
            <a href="https://www.notion.so/psql/2d5acec90a90802ab8b3dfa8a3258357" target="_blank" class="notion-link">
                <span>→ Database</span>
            </a>
            <button type="button" id="archiveBtn" class="archive-btn">
                Archive
                <span class="shortcut">⌘↵</span>
            </button>
        </div>
    </div>

    <div class="editor-container">
        <div class="editor-wrapper">
            <form id="archiveForm">
                <textarea
                    id="notes"
                    name="notes"
                    placeholder="2025.12.26.1430.GMT-0800
Your notes here...

2025.12.26.1545.GMT-0800
Another entry..."
                    autofocus
                ></textarea>
            </form>
        </div>
    </div>

    <div id="statusBar" class="status-bar hidden"></div>

    <script>
        const form = document.getElementById('archiveForm');
        const textarea = document.getElementById('notes');
        const archiveBtn = document.getElementById('archiveBtn');
        const statusBar = document.getElementById('statusBar');

        // Handle form submission
        async function archiveNotes(e) {
            if (e) e.preventDefault();

            const notes = textarea.value;

            if (!notes.trim()) {
                showStatus('Nothing to archive', 'error');
                return;
            }

            archiveBtn.disabled = true;
            archiveBtn.textContent = 'Archiving...';
            statusBar.className = 'status-bar hidden';

            try {
                const response = await fetch('/api/archive', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ notes }),
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(data.message || 'Archived successfully', 'success');
                    textarea.value = '';
                    textarea.focus();
                } else {
                    showStatus(data.error || 'Failed to archive', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('Network error. Please try again.', 'error');
            } finally {
                archiveBtn.disabled = false;
                archiveBtn.innerHTML = 'Archive<span class="shortcut">⌘↵</span>';
            }
        }

        function showStatus(message, type) {
            statusBar.textContent = message;
            statusBar.className = `status-bar ${type}`;

            if (type === 'success') {
                setTimeout(() => {
                    statusBar.className = 'status-bar hidden';
                }, 3000);
            }
        }

        // Submit on button click
        archiveBtn.addEventListener('click', archiveNotes);
        form.addEventListener('submit', archiveNotes);

        // Keyboard shortcut: Cmd+Enter (Mac) or Ctrl+Enter (Windows/Linux)
        textarea.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                archiveNotes();
            }
        });

        // Auto-resize textarea
        textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        });
    </script>
</body>
</html>
